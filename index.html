<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>P8 Loom Generator</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="bar">
    <h1>P8 Loom Generator</h1>
    <span id="version" class="muted"></span>
    <span id="step" class="muted"></span>
  </header>

  <main>
    <section class="card">
      <h2>Component library</h2>
      <p class="muted">Load the library JSON from the Dynaflow Drive. It is read in this browser only and never uploaded.</p>
      <div class="actions">
        <label class="button">Load library file…
          <input id="library-file" type="file" accept=".json,application/json" hidden>
        </label>
        <button id="library-sample" type="button">Load dummy sample</button>
      </div>
      <details id="library-details">
        <summary>Library details</summary>
        <div id="library-view"><p class="muted">No library loaded.</p></div>
      </details>
    </section>

    <section class="card">
      <h2>Project</h2>
      <div id="project-view"></div>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
