<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>P8 Loom Generator</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="bar">
    <h1>P8 Loom Generator</h1>
    <span id="version" class="muted"></span>
  </header>

  <main>
    <section class="card">
      <h2>Status</h2>
      <p id="step"></p>
      <ul id="checks"></ul>
    </section>

    <section class="card">
      <h2>Data</h2>
      <p>This site holds no Dynaflow data. The component library and project files stay on your computer or the Dynaflow Drive and are loaded into the browser only.</p>
      <p>Dummy examples: <a href="samples/sample-library.json">sample library</a> · <a href="samples/sample-project.json">sample project</a></p>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
